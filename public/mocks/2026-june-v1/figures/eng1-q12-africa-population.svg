<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700">Population and Population Density of African Countries in 2015</text>
  <!-- header -->
  <rect x="20" y="48" width="180" height="44" fill="#f3f4f6" stroke="#111" stroke-width="1"/>
  <text x="110" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Country</text>
  <rect x="200" y="48" width="170" height="44" fill="#f3f4f6" stroke="#111" stroke-width="1"/>
  <text x="285" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Density</text>
  <text x="285" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">(inhabitants/km²)</text>
  <rect x="370" y="48" width="150" height="44" fill="#f3f4f6" stroke="#111" stroke-width="1"/>
  <text x="445" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Area</text>
  <text x="445" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">(km²)</text>
  <rect x="520" y="48" width="180" height="44" fill="#f3f4f6" stroke="#111" stroke-width="1"/>
  <text x="610" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Estimated</text>
  <text x="610" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">population</text>
  <!-- row 1 -->
  <rect x="20" y="92" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="30" y="116" text-anchor="start" font-family="Georgia, serif" font-size="13">Equatorial Guinea</text>
  <rect x="200" y="92" width="170" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="285" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13">30.1</text>
  <rect x="370" y="92" width="150" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="445" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13">28,051</text>
  <rect x="520" y="92" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="610" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13">845,000</text>
  <!-- row 2 -->
  <rect x="20" y="128" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="30" y="152" text-anchor="start" font-family="Georgia, serif" font-size="13">Comoros</text>
  <rect x="200" y="128" width="170" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="285" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="13">363.1</text>
  <rect x="370" y="128" width="150" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="445" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="13">2,170</text>
  <rect x="520" y="128" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="610" y="152" text-anchor="middle" font-family="Georgia, serif" font-size="13">788,000</text>
  <!-- row 3 -->
  <rect x="20" y="164" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="30" y="188" text-anchor="start" font-family="Georgia, serif" font-size="13">Mali</text>
  <rect x="200" y="164" width="170" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="285" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="13">14.2</text>
  <rect x="370" y="164" width="150" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="445" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="13">1,240,000</text>
  <rect x="520" y="164" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="610" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="13">17,600,000</text>
  <!-- row 4 -->
  <rect x="20" y="200" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="30" y="224" text-anchor="start" font-family="Georgia, serif" font-size="13">Burkina Faso</text>
  <rect x="200" y="200" width="170" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="285" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13">66.0</text>
  <rect x="370" y="200" width="150" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="445" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13">274,200</text>
  <rect x="520" y="200" width="180" height="36" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="610" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="13">18,106,000</text>
</svg>
