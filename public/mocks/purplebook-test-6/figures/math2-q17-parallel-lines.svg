<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- parallels -->
  <line x1="60" y1="80" x2="420" y2="80" stroke="#111" stroke-width="2.5"/>
  <line x1="60" y1="260" x2="420" y2="260" stroke="#111" stroke-width="2.5"/>
  <!-- parallel arrow marks -->
  <polygon points="230,80 242,76 242,84" fill="#111"/>
  <polygon points="250,80 262,76 262,84" fill="#111"/>
  <polygon points="230,260 242,256 242,264" fill="#111"/>
  <polygon points="250,260 262,256 262,264" fill="#111"/>
  <!-- transversals -->
  <line x1="100" y1="80" x2="380" y2="260" stroke="#111" stroke-width="2.5"/>
  <line x1="380" y1="80" x2="100" y2="260" stroke="#111" stroke-width="2.5"/>
  <!-- angle arcs: y at B (obtuse, below-left of B along BA and BC), z at D, x at E (∠AEB) -->
  <path d="M 344,80 A 36 36 0 0 1 358,108" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="322" y="108" font-family="Georgia, serif" font-size="15" font-style="italic">y</text>
  <path d="M 344,260 A 36 36 0 0 0 358,232" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="322" y="242" font-family="Georgia, serif" font-size="15" font-style="italic">z</text>
  <path d="M 220,154 A 26 26 0 0 1 260,154" fill="none" stroke="#111" stroke-width="1.3"/>
  <text x="236" y="142" font-family="Georgia, serif" font-size="15" font-style="italic">x</text>
  <text x="82" y="70" font-family="Georgia, serif" font-size="15" font-weight="700">A</text>
  <text x="388" y="70" font-family="Georgia, serif" font-size="15" font-weight="700">B</text>
  <text x="82" y="282" font-family="Georgia, serif" font-size="15" font-weight="700">C</text>
  <text x="388" y="282" font-family="Georgia, serif" font-size="15" font-weight="700">D</text>
  <text x="250" y="176" font-family="Georgia, serif" font-size="15" font-weight="700">E</text>
  <text x="240.0" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic">Note: Figure not drawn to scale.</text>
</svg>
