<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="320" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700">Examples of Hoards found in Ireland and Northern Ireland</text>
  <!-- header -->
  <rect x="20" y="48" width="150" height="44" fill="#f3f4f6" stroke="#111"/>
  <text x="95" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Hoard name</text>
  <rect x="170" y="48" width="170" height="44" fill="#f3f4f6" stroke="#111"/>
  <text x="255" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Date of contents</text>
  <rect x="340" y="48" width="110" height="44" fill="#f3f4f6" stroke="#111"/>
  <text x="395" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Year of</text>
  <text x="395" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">discovery</text>
  <rect x="450" y="48" width="170" height="44" fill="#f3f4f6" stroke="#111"/>
  <text x="535" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700">Description</text>
  <!-- Broighter -->
  <rect x="20" y="92" width="150" height="44" fill="#fff" stroke="#111"/>
  <text x="95" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="12">Broighter Hoard</text>
  <rect x="170" y="92" width="170" height="44" fill="#fff" stroke="#111"/>
  <text x="255" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="12">1st century BCE</text>
  <rect x="340" y="92" width="110" height="44" fill="#fff" stroke="#111"/>
  <text x="395" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="12">1896</text>
  <rect x="450" y="92" width="170" height="44" fill="#fff" stroke="#111"/>
  <text x="535" y="119" text-anchor="middle" font-family="Georgia, serif" font-size="12">gold pieces</text>
  <!-- Balline -->
  <rect x="20" y="136" width="150" height="44" fill="#fff" stroke="#111"/>
  <text x="95" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="12">Balline Hoard</text>
  <rect x="170" y="136" width="170" height="44" fill="#fff" stroke="#111"/>
  <text x="255" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="12">4th century CE</text>
  <rect x="340" y="136" width="110" height="44" fill="#fff" stroke="#111"/>
  <text x="395" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="12">1940</text>
  <rect x="450" y="136" width="170" height="44" fill="#fff" stroke="#111"/>
  <text x="535" y="163" text-anchor="middle" font-family="Georgia, serif" font-size="12">silver pieces</text>
  <!-- Dooyork -->
  <rect x="20" y="180" width="150" height="52" fill="#fff" stroke="#111"/>
  <text x="95" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="12">Dooyork Hoard</text>
  <rect x="170" y="180" width="170" height="52" fill="#fff" stroke="#111"/>
  <text x="255" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="12">3rd century BCE–2nd</text>
  <text x="255" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="12">century CE</text>
  <rect x="340" y="180" width="110" height="52" fill="#fff" stroke="#111"/>
  <text x="395" y="211" text-anchor="middle" font-family="Georgia, serif" font-size="12">2001</text>
  <rect x="450" y="180" width="170" height="52" fill="#fff" stroke="#111"/>
  <text x="535" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="12">gold, bronze, and</text>
  <text x="535" y="218" text-anchor="middle" font-family="Georgia, serif" font-size="12">beads</text>
</svg>
