<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="430" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Studies of the Effects of Tilling vs. No Tilling on Crop Yields</text>
  <!-- header -->
  <rect x="10" y="40" width="220" height="52" fill="#f3f4f6" stroke="#111"/>
  <text x="120" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700">Authors</text>
  <rect x="230" y="40" width="110" height="52" fill="#f3f4f6" stroke="#111"/>
  <text x="285" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700">Crop</text>
  <rect x="340" y="40" width="250" height="52" fill="#f3f4f6" stroke="#111"/>
  <text x="465" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700">Crop yield with tilling</text>
  <text x="465" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700">(kilograms per hectare)</text>
  <rect x="590" y="40" width="260" height="52" fill="#f3f4f6" stroke="#111"/>
  <text x="720" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700">Crop yield with no tilling</text>
  <text x="720" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700">(kilograms per hectare)</text>
  <!-- row 1 -->
  <rect x="10" y="92" width="220" height="36" fill="#fff" stroke="#111"/>
  <text x="120" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="11">Eduardo Martinez and colleagues</text>
  <rect x="230" y="92" width="110" height="36" fill="#fff" stroke="#111"/>
  <text x="285" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12">winter wheat</text>
  <rect x="340" y="92" width="250" height="36" fill="#fff" stroke="#111"/>
  <text x="465" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12">4,829</text>
  <rect x="590" y="92" width="260" height="36" fill="#fff" stroke="#111"/>
  <text x="720" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="12">2,894</text>
  <!-- row 2 -->
  <rect x="10" y="128" width="220" height="36" fill="#fff" stroke="#111"/>
  <text x="120" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="11">Fuseini Issaka and colleagues</text>
  <rect x="230" y="128" width="110" height="36" fill="#fff" stroke="#111"/>
  <text x="285" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12">rice</text>
  <rect x="340" y="128" width="250" height="36" fill="#fff" stroke="#111"/>
  <text x="465" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12">6,400</text>
  <rect x="590" y="128" width="260" height="36" fill="#fff" stroke="#111"/>
  <text x="720" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="12">6,300</text>
  <!-- row 3 -->
  <rect x="10" y="164" width="220" height="36" fill="#fff" stroke="#111"/>
  <text x="120" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="11">Roberto Izaurralde and colleagues</text>
  <rect x="230" y="164" width="110" height="36" fill="#fff" stroke="#111"/>
  <text x="285" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="12">spring barley</text>
  <rect x="340" y="164" width="250" height="36" fill="#fff" stroke="#111"/>
  <text x="465" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="12">1,676</text>
  <rect x="590" y="164" width="260" height="36" fill="#fff" stroke="#111"/>
  <text x="720" y="186" text-anchor="middle" font-family="Georgia, serif" font-size="12">2,515</text>
  <!-- row 4 -->
  <rect x="10" y="200" width="220" height="36" fill="#fff" stroke="#111"/>
  <text x="120" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="11">Igor Bogunovic and colleagues</text>
  <rect x="230" y="200" width="110" height="36" fill="#fff" stroke="#111"/>
  <text x="285" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">maize</text>
  <rect x="340" y="200" width="250" height="36" fill="#fff" stroke="#111"/>
  <text x="465" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">3,884</text>
  <rect x="590" y="200" width="260" height="36" fill="#fff" stroke="#111"/>
  <text x="720" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">5,716</text>
</svg>
