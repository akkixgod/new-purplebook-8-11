<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- grid: origin (50,370); x: 60px/unit for 0..5; y: 25px/unit for 0..12 -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="50" y1="370" x2="50" y2="70"/>
    <line x1="110" y1="370" x2="110" y2="70"/>
    <line x1="170" y1="370" x2="170" y2="70"/>
    <line x1="230" y1="370" x2="230" y2="70"/>
    <line x1="290" y1="370" x2="290" y2="70"/>
    <line x1="350" y1="370" x2="350" y2="70"/>
    <line x1="50" y1="370" x2="350" y2="370"/>
    <line x1="50" y1="345" x2="350" y2="345"/>
    <line x1="50" y1="320" x2="350" y2="320"/>
    <line x1="50" y1="295" x2="350" y2="295"/>
    <line x1="50" y1="270" x2="350" y2="270"/>
    <line x1="50" y1="245" x2="350" y2="245"/>
    <line x1="50" y1="220" x2="350" y2="220"/>
    <line x1="50" y1="195" x2="350" y2="195"/>
    <line x1="50" y1="170" x2="350" y2="170"/>
    <line x1="50" y1="145" x2="350" y2="145"/>
    <line x1="50" y1="120" x2="350" y2="120"/>
    <line x1="50" y1="95" x2="350" y2="95"/>
    <line x1="50" y1="70" x2="350" y2="70"/>
  </g>
  <line x1="50" y1="370" x2="365" y2="370" stroke="#111" stroke-width="1.5"/>
  <line x1="50" y1="370" x2="50" y2="55" stroke="#111" stroke-width="1.5"/>
  <polygon points="365,370 355,365 355,375" fill="#111"/>
  <polygon points="50,55 45,65 55,65" fill="#111"/>
  <text x="372" y="374" font-family="Georgia, serif" font-size="14" font-style="italic">x</text>
  <text x="56" y="52" font-family="Georgia, serif" font-size="14" font-style="italic">y</text>
  <text x="50" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12">0</text>
  <text x="110" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12">1</text>
  <text x="170" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12">2</text>
  <text x="230" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12">3</text>
  <text x="290" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12">4</text>
  <text x="350" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="12">5</text>
  <text x="40" y="374" text-anchor="end" font-family="Georgia, serif" font-size="12">0</text>
  <text x="40" y="324" text-anchor="end" font-family="Georgia, serif" font-size="12">2</text>
  <text x="40" y="274" text-anchor="end" font-family="Georgia, serif" font-size="12">4</text>
  <text x="40" y="224" text-anchor="end" font-family="Georgia, serif" font-size="12">6</text>
  <text x="40" y="174" text-anchor="end" font-family="Georgia, serif" font-size="12">8</text>
  <text x="40" y="124" text-anchor="end" font-family="Georgia, serif" font-size="12">10</text>
  <text x="40" y="74" text-anchor="end" font-family="Georgia, serif" font-size="12">12</text>
  <!-- line y = 2.5x + 5 from x=0 to where y=12 (x=2.8) -->
  <line x1="50" y1="245" x2="218" y2="70" stroke="#111" stroke-width="2.5"/>
</svg>
