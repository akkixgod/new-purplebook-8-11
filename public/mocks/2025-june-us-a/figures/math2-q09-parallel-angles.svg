<svg xmlns="http://www.w3.org/2000/svg" width="380" height="300" viewBox="0 0 380 300">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- Line S-T-W -->
  <line x1="120" y1="40" x2="170" y2="220" stroke="#111" stroke-width="2"/>
  <!-- TU parallel VW -->
  <line x1="140" y1="110" x2="300" y2="110" stroke="#111" stroke-width="2"/>
  <line x1="170" y1="220" x2="310" y2="220" stroke="#111" stroke-width="2"/>
  <!-- UV side -->
  <line x1="300" y1="110" x2="310" y2="220" stroke="#111" stroke-width="2"/>
  <!-- Labels -->
  <text x="102" y="46" font-family="Georgia, serif" font-size="16">S</text>
  <text x="120" y="116" font-family="Georgia, serif" font-size="16">T</text>
  <text x="310" y="116" font-family="Georgia, serif" font-size="16">U</text>
  <text x="320" y="226" font-family="Georgia, serif" font-size="16">V</text>
  <text x="148" y="228" font-family="Georgia, serif" font-size="16">W</text>
  <!-- Angle marks: p at U, r at W -->
  <path d="M 272 110 A 28 28 0 0 1 292 136" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="252" y="138" font-family="Arial, sans-serif" font-size="14">p°</text>
  <path d="M 198 220 A 28 28 0 0 0 180 194" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="202" y="202" font-family="Arial, sans-serif" font-size="14">r°</text>
  <text x="190" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-style="italic">Note: Figure not drawn to scale.</text>
</svg>
