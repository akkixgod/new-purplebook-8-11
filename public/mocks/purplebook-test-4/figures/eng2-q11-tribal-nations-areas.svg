if" font-size="11">Arizona</text><rect x="340" y="164" width="140" height="36" fill="#fff" stroke="#111"/><text x="410.0" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="11">4,453</text><rect x="20" y="200" width="200" height="36" fill="#fff" stroke="#111"/><text x="120.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="11">Choctaw Nation</text><rect x="220" y="200" width="120" height="36" fill="#fff" stroke="#111"/><text x="280.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="11">Oklahoma</text><rect x="340" y="200" width="140" height="36" fill="#fff" stroke="#111"/><text x="410.0" y="224" text-anchor="middle" font-family="Georgia, serif" font-size="11">10,864</text><rect x="20" y="236" width="200" height="36" fill="#fff" stroke="#111"/><text x="120.0" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11">Yakama Nation</text><rect x="220" y="236" width="120" height="36" fill="#fff" stroke="#111"/><text x="280.0" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11">Washington</text><rect x="340" y="236" width="140" height="36" fill="#fff" stroke="#111"/><text x="410.0" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="11">2,188</text>
