<svg xmlns="http://www.w3.org/2000/svg" width="420" height="340" viewBox="0 0 420 340">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- outer face (hypotenuse triangle) -->
  <polygon points="205,45 70,270 350,255" fill="none" stroke="#111" stroke-width="2.2"/>
  <!-- dashed mutually perpendicular legs from right-angle vertex -->
  <line x1="200" y1="200" x2="205" y2="45" stroke="#111" stroke-width="1.7" stroke-dasharray="6 4"/>
  <line x1="200" y1="200" x2="70" y2="270" stroke="#111" stroke-width="1.7" stroke-dasharray="6 4"/>
  <line x1="200" y1="200" x2="350" y2="255" stroke="#111" stroke-width="1.7" stroke-dasharray="6 4"/>
  <rect x="200" y="188" width="12" height="12" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="210" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic">Note: Figure not drawn to scale.</text>
</svg>
