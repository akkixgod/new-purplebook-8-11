<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="390" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Orientation of Paired Leaves in Grapevines and Related Species</text>
  <!-- header -->
  <rect x="12" y="40" width="120" height="52" fill="#f3f4f6" stroke="#111"/>
