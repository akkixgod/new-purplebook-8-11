  <!-- row 4 -->
  <rect x="10" y="200" width="200" height="36" fill="#fff" stroke="#111"/>
  <text x="110" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="11">Adrian Gracia-Romero and colleagues</text>
  <rect x="210" y="200" width="90" height="36" fill="#fff" stroke="#111"/>
  <text x="255" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">Zimbabwe</text>
  <rect x="300" y="200" width="90" height="36" fill="#fff" stroke="#111"/>
  <text x="345" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">maize</text>
  <rect x="390" y="200" width="210" height="36" fill="#fff" stroke="#111"/>
  <text x="495" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">2,420</text>
  <rect x="600" y="200" width="210" height="36" fill="#fff" stroke="#111"/>
  <text x="705" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="12">2,990</text>
