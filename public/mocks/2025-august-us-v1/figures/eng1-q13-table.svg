  <rect x="20" y="56" width="160" height="36" fill="#f3f4f6" stroke="#111" stroke-width="1"/><text x="100.0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Species</text><rect x="180" y="56" width="130" height="36" fill="#f3f4f6" stroke="#111" stroke-width="1"/><text x="245.0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Heart tissue color</text><rect x="310" y="56" width="120" height="36" fill="#f3f4f6" stroke="#111" stroke-width="1"/><text x="370.0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Average Mb level</text><rect x="430" y="56" width="160" height="36" fill="#f3f4f6" stroke="#111" stroke-width="1"/><text x="510.0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Standard deviation of Mb level</text><rect x="590" y="56" width="160" height="36" fill="#f3f4f6" stroke="#111" stroke-width="1"/><text x="670.0" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Number of healthy fish observed</text><rect x="20" y="92" width="160" height="36" fill="#fff" stroke="#111" stroke-width="1"/><text x="100.0" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="12">Danio rerio</text><rect x="180" y="92" width="130" height="36" fill="#fff" stroke="#111" stroke-width="1"/><text x="245.0" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="12">red</text><rect x="310" y="92" width="120" height="36" fill="#fff" stroke="#111" stroke-width="1"/><text x="370.0" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="12">10.45</text><rect x="430" y="92" width="160" height="36" fill="#fff" stroke="#111" stroke-width="1"/><text x="510.0" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="12">1.16</text><rect x="590" y="92" width="160" height="36" fill="#fff" stroke="#111" stroke-width="1"/><text x="670.0" y="11