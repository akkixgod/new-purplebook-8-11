<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="320" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700">Prices of Nuts Sold by Growers</text>
  <text x="320" y="44" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700">in the United States, 2016/17 to 2019/20 Seasons</text>
  <text x="20" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="12" transform="rotate(-90 20 220)">Price per pound (dollars)</text>
  <line x1="80" y1="340" x2="600" y2="340" stroke="#e5e7eb"/>
  <text x="72" y="344" text-anchor="end" font-family="Georgia, serif" font-size="11">0</text>
  <line x1="80" y1="260" x2="600" y2="260" stroke="#e5e7eb"/>
  <text x="72" y="264" text-anchor="end" font-family="Georgia, serif" font-size="11">1</text>
  <line x1="80" y1="180" x2="600" y2="180" stroke="#e5e7eb"/>
  <text x="72" y="184" text-anchor="end" font-family="Georgia, serif" font-size="11">2</text>
  <line x1="80" y1="100" x2="600" y2="100" stroke="#e5e7eb"/>
  <text x="72" y="104" text-anchor="end" font-family="Georgia, serif" font-size="11">3</text>
  <line x1="80" y1="100" x2="80" y2="340" stroke="#111"/>
  <line x1="80" y1="340" x2="600" y2="340" stroke="#111"/>
  <!-- 2016/17: 1.35, 2.39, 0.93 -->
  <rect x="110" y="232" width="22" height="108" fill="#6b7280" stroke="#111"/>
  <rect x="134" y="148.8" width="22" height="191.2" fill="#d1d5db" stroke="#111"/>
  <rect x="158" y="265.6" width="22" height="74.4" fill="#111" stroke="#111"/>
  <text x="145" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12">2016/17</text>
  <!-- 2017/18: 1.15, 2.53, 1.25 -->
  <rect x="230" y="248" width="22" height="92" fill="#6b7280" stroke="#111"/>
  <rect x="254" y="137.6" width="22" height="202.4" fill="#d1d5db" stroke="#111"/>
  <rect x="278" y="240" width="22" height="100" fill="#111" stroke="#111"/>
  <text x="265" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12">2017/18</text>
  <!-- 2018/19: 0.90, 2.50, 0.68 -->
  <rect x="350" y="268" width="22" height="72" fill="#6b7280" stroke="#111"/>
  <rect x="374" y="140" width="22" height="200" fill="#d1d5db" stroke="#111"/>
  <rect x="398" y="285.6" width="22" height="54.4" fill="#111" stroke="#111"/>
  <text x="385" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12">2018/19</text>
  <!-- 2019/20: 0.96, 2.45, 0.95 -->
  <rect x="470" y="263.2" width="22" height="76.8" fill="#6b7280" stroke="#111"/>
  <rect x="494" y="144" width="22" height="196" fill="#d1d5db" stroke="#111"/>
  <rect x="518" y="264" width="22" height="76" fill="#111" stroke="#111"/>
  <text x="505" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="12">2019/20</text>
  <text x="340" y="382" text-anchor="middle" font-family="Georgia, serif" font-size="12">Season</text>
  <rect x="160" y="398" width="12" height="12" fill="#6b7280" stroke="#111"/>
  <text x="178" y="409" font-family="Georgia, serif" font-size="11">hazelnuts</text>
  <rect x="280" y="398" width="12" height="12" fill="#d1d5db" stroke="#111"/>
  <text x="298" y="409" font-family="Georgia, serif" font-size="11">almonds</text>
  <rect x="400" y="398" width="12" height="12" fill="#111" stroke="#111"/>
  <text x="418" y="409" font-family="Georgia, serif" font-size="11">walnuts</text>
</svg>
