<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="320" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">Fish Population in a Taiwanese Tide Pool,</text>
  <text x="320" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700">January 2001 to October 2001</text>
  <text x="18" y="215" text-anchor="middle" font-family="Georgia, serif" font-size="12" transform="rotate(-90 18 215)">Number of individual fish observed</text>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#e5e7eb"/><text x="72" y="364" text-anchor="end" font-family="Georgia, serif" font-size="11">0</text>
  <line x1="80" y1="315.38" x2="600" y2="315.38" stroke="#e5e7eb"/><text x="72" y="319.38" text-anchor="end" font-family="Georgia, serif" font-size="11">10</text>
  <line x1="80" y1="270.77" x2="600" y2="270.77" stroke="#e5e7eb"/><text x="72" y="274.77" text-anchor="end" font-family="Georgia, serif" font-size="11">20</text>
  <line x1="80" y1="226.15" x2="600" y2="226.15" stroke="#e5e7eb"/><text x="72" y="230.15" text-anchor="end" font-family="Georgia, serif" font-size="11">30</text>
  <line x1="80" y1="181.54" x2="600" y2="181.54" stroke="#e5e7eb"/><text x="72" y="185.54" text-anchor="end" font-family="Georgia, serif" font-size="11">40</text>
  <line x1="80" y1="136.92" x2="600" y2="136.92" stroke="#e5e7eb"/><text x="72" y="140.92" text-anchor="end" font-family="Georgia, serif" font-size="11">50</text>
  <line x1="80" y1="92.31" x2="600" y2="92.31" stroke="#e5e7eb"/><text x="72" y="96.31" text-anchor="end" font-family="Georgia, serif" font-size="11">60</text>
  <line x1="80" y1="70" x2="600" y2="70" stroke="#e5e7eb"/><text x="72" y="74" text-anchor="end" font-family="Georgia, serif" font-size="11">65</text>
  <line x1="80" y1="70" x2="80" y2="360" stroke="#111"/>
  <line x1="80" y1="360" x2="600" y2="360" stroke="#111"/>
  <text x="80" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="11">January 2001</text>
  <text x="253.33" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="11">April 2001</text>
  <text x="426.67" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="11">July 2001</text>
  <text x="600" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="11">October 2001</text>
  <text x="340" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="12">Month</text>
  <!-- combtooth blenny: 62, 3, 3, 1 -->
  <polyline points="80,83.38 253.33,346.62 426.67,346.62 600,355.54" fill="none" stroke="#111" stroke-width="2"/>
  <polygon points="80,77.38 85.5,87.88 74.5,87.88" fill="#111"/>
  <polygon points="253.33,340.62 258.83,351.12 247.83,351.12" fill="#111"/>
  <polygon points="426.67,340.62 432.17,351.12 421.17,351.12" fill="#111"/>
  <polygon points="600,349.54 605.5,360.04 594.5,360.04" fill="#111"/>
  <!-- three-lined rainbowfish: 0, 0, 0, 3 -->
  <polyline points="80,360 253.33,360 426.67,360 600,346.62" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="75.5" y="355.5" width="9" height="9" fill="#fff" stroke="#111"/>
  <rect x="248.83" y="355.5" width="9" height="9" fill="#fff" stroke="#111"/>
  <rect x="422.17" y="355.5" width="9" height="9" fill="#fff" stroke="#111"/>
  <rect x="595.5" y="342.12" width="9" height="9" fill="#fff" stroke="#111"/>
  <!-- barred flagtail: 14, 9, 7, 16 -->
  <polyline points="80,297.54 253.33,319.85 426.67,328.77 600,288.62" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="80" cy="297.54" r="4.5" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="253.33" cy="319.85" r="4.5" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="426.67" cy="328.77" r="4.5" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="600" cy="288.62" r="4.5" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="70" y1="440" x2="100" y2="440" stroke="#111" stroke-width="2"/>
  <polygon points="85,434 90.5,444.5 79.5,444.5" fill="#111"/>
  <text x="108" y="444" font-family="Georgia, serif" font-size="11">combtooth blenny</text>
  <line x1="250" y1="440" x2="280" y2="440" stroke="#111" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="260.5" y="435.5" width="9" height="9" fill="#fff" stroke="#111"/>
  <text x="288" y="444" font-family="Georgia, serif" font-size="11">three-lined rainbowfish</text>
  <line x1="460" y1="440" x2="490" y2="440" stroke="#6b7280" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="475" cy="440" r="4.5" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="498" y="444" font-family="Georgia, serif" font-size="11">barred flagtail</text>
</svg>
