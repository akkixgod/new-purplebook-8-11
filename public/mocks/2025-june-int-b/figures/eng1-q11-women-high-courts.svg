<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400">
  <rect width="100%" height="100%" fill="#fff"/>
  <!-- Y-axis label -->
  <text x="18" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="12" transform="rotate(-90 18 200)">Number</text>
  <!-- Grid / axis: y 0..6, plot area x=70..470, y=60..300 -->
  <line x1="70" y1="300" x2="470" y2="300" stroke="#e5e7eb"/>
  <text x="62" y="304" text-anchor="end" font-family="Georgia, serif" font-size="11">0</text>
  <line x1="70" y1="260" x2="470" y2="260" stroke="#e5e7eb"/>
  <text x="62" y="264" text-anchor="end" font-family="Georgia, serif" font-size="11">2</text>
  <line x1="70" y1="220" x2="470" y2="220" stroke="#e5e7eb"/>
  <text x="62" y="224" text-anchor="end" font-family="Georgia, serif" font-size="11">4</text>
  <line x1="70" y1="180" x2="470" y2="180" stroke="#e5e7eb"/>
  <text x="62" y="184" text-anchor="end" font-family="Georgia, serif" font-size="11">6</text>
  <line x1="70" y1="60" x2="70" y2="300" stroke="#111" stroke-width="1.5"/>
  <line x1="70" y1="300" x2="470" y2="300" stroke="#111" stroke-width="1.5"/>
  <!-- x ticks: 1980,1990,2000,2010 at x=100,210,320,430 -->
  <text x="100" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="11">1980</text>
  <text x="210" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="11">1990</text>
  <text x="320" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="11">2000</text>
  <text x="430" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="11">2010</text>
  <text x="270" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="12">Year</text>
  <!-- y = 300 - value*20 -->
  <!-- Philippines: 1,3,3,3 solid + filled triangles -->
  <polyline points="100,280 210,240 320,240 430,240" fill="none" stroke="#111" stroke-width="2"/>
  <polygon points="100,274 94,286 106,286" fill="#111"/>
  <polygon points="210,234 204,246 216,246" fill="#111"/>
  <polygon points="320,234 314,246 326,246" fill="#111"/>
  <polygon points="430,234 424,246 436,246" fill="#111"/>
  <!-- Singapore: 0,0,2,3 dashed + open squares -->
  <polyline points="100,300 210,300 320,260 430,240" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="95" y="295" width="10" height="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="205" y="295" width="10" height="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="315" y="255" width="10" height="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <rect x="425" y="235" width="10" height="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <!-- Mexico: 2,5,2,3 dotted + open circles -->
  <polyline points="100,260 210,200 320,260 430,240" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="2 3"/>
  <circle cx="100" cy="260" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="200" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="320" cy="260" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <circle cx="430" cy="240" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <!-- Legend -->
  <polygon points="90,372 84,384 96,384" fill="#111"/>
  <line x1="102" y1="378" x2="130" y2="378" stroke="#111" stroke-width="2"/>
  <text x="136" y="382" font-family="Georgia, serif" font-size="12">Philippines</text>
  <rect x="230" y="373" width="10" height="10" fill="#fff" stroke="#111"/>
  <line x1="246" y1="378" x2="274" y2="378" stroke="#111" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="280" y="382" font-family="Georgia, serif" font-size="12">Singapore</text>
  <circle cx="370" cy="378" r="5" fill="#fff" stroke="#111"/>
  <line x1="382" y1="378" x2="410" y2="378" stroke="#111" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="416" y="382" font-family="Georgia, serif" font-size="12">Mexico</text>
</svg>
